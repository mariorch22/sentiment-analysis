services:
  # --- Storage ---
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-API
      - "9001:9001"   # Web-Console
    volumes:
      - minio-data:/data

  # Legt einmalig die Buckets an, läuft dann aus
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/bronze;
      mc mb -p local/silver;
      mc mb -p local/gold;
      "

# --- Batch-Processing (bronze -> silver -> gold, VADER) ---
  batch:
    build: ./batch
    profiles: ["batch"]
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN}
    ports:
      - "8002:8002"

  # --- Serving (FastAPI + DuckDB in-process) ---
  api:
    build: ./api
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"

  # --- Live-Inference (HF-Modell, GPU) ---
  inference:
    build: ./inference
    ports:
      - "8001:8001"

  # --- Dashboard (React + Vite, served via nginx) ---
  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls the API at the host-published address, not the docker-compose name
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  minio-data: